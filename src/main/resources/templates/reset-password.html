<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset password · Twibo</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head><body><main class="shell"><section class="card"><h1>Choose a new password</h1>
  <p class="error" th:if="${error}" th:text="${error}"></p>
  <form class="stack" th:action="@{/recover/reset}" method="post"><label>New password<input type="password" name="password" minlength="8" maxlength="72" required autocomplete="new-password"></label><button>Update password</button></form>
</section></main></body></html>
