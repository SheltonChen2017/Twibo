<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create account · Twibo</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head><body><main class="shell"><section class="card">
  <h1>Create your account</h1><p class="error" th:if="${error}" th:text="${error}"></p>
  <form class="stack" th:action="@{/signup}" th:object="${signupForm}" method="post">
    <label>Username<input th:field="*{username}" required autocomplete="username" minlength="3" maxlength="30"></label>
    <span class="field-error" th:errors="*{username}"></span>
    <label>Password<input type="password" th:field="*{password}" required autocomplete="new-password" minlength="8" maxlength="72"></label>
    <span class="field-error" th:errors="*{password}"></span>
    <label>Birthday<input type="date" th:field="*{birthday}" required></label>
    <span class="field-error" th:errors="*{birthday}"></span>
    <label>Recovery question<input th:field="*{securityQuestion}" required maxlength="120" placeholder="Something only you know"></label>
    <span class="field-error" th:errors="*{securityQuestion}"></span>
    <label>Recovery answer<input type="password" th:field="*{securityAnswer}" required maxlength="100"></label>
    <span class="field-error" th:errors="*{securityAnswer}"></span>
    <button type="submit">Join Twibo</button>
  </form><p><a th:href="@{/login}">Already have an account?</a></p>
</section></main></body></html>
