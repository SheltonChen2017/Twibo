<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recover account · Twibo</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<main id="main-content" class="auth-page">
  <div class="auth-wrap">
    <a class="brand auth-brand" th:href="@{/}"><span class="brand-mark" aria-hidden="true">T</span><span>Twibo</span></a>
    <section class="card auth-card">
      <h1>Recover your account</h1>
      <p>Enter the private recovery phrase you chose when you signed up.</p>
      <div class="alert error" role="alert" th:if="${error}" th:text="${error}"></div>
      <form class="stack" th:action="@{/recover/verify}" method="post">
        <div class="field"><label for="username">Username</label><input id="username" name="username" required maxlength="30" autocomplete="username" autocapitalize="none"></div>
        <div class="field"><label for="recoveryPhrase">Private recovery phrase</label><input id="recoveryPhrase" type="password" name="recoveryPhrase" required minlength="8" maxlength="72" autocomplete="off"></div>
        <button type="submit">Verify recovery phrase</button>
      </form>
      <p class="auth-footer"><a th:href="@{/login}">Back to sign in</a></p>
    </section>
  </div>
</main>
</body>
</html>
