<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title th:text="${individual.username} + ' · Twibo'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <section class="card">
        <h1 th:text="${individual.username}"></h1>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <p class="success" th:if="${message}" th:text="${message}"></p>
        <form method="post" th:action="@{'/users/' + ${individual.id} + '/follow'}" th:unless="${ownProfile}">
            <button th:text="${following} ? 'Unfollow' : 'Follow'" type="submit"></button>
        </form>
        <p class="meta" th:if="${ownProfile}">This is your profile.</p>
    </section>
    <section aria-live="polite" data-profile-posts th:attr="data-user-id=${individual.id}">
        <p class="card empty">Loading posts…</p>
    </section>
</main>
</body>
</html>
