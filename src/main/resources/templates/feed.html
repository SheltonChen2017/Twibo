<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your feed · Twibo</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head><body><nav th:replace="~{fragments :: nav}"></nav><main class="shell">
  <p class="error" th:if="${error}" th:text="${error}"></p>
  <section class="card"><h1 th:text="|Hello, ${currentUser.username}|"></h1>
    <form class="stack" th:action="@{/posts}" method="post"><label for="content">Share something</label>
      <textarea id="content" name="content" maxlength="1000" required></textarea><button type="submit">Post</button></form>
  </section>
  <section class="card" th:each="post : ${posts}">
    <div class="meta"><a th:href="@{/users/{id}(id=${post.author.id})}" th:text="${post.author.username}"></a>
      · <time th:text="${#temporals.format(post.createdAt, 'MMM d, yyyy h:mm a')}"></time></div>
    <p class="content" th:text="${post.content}"></p><a th:href="@{/posts/{id}(id=${post.id})}">View conversation</a>
  </section>
  <section class="card" th:if="${#lists.isEmpty(posts)}"><p>Your feed is quiet. Publish the first post or search for someone to follow.</p></section>
</main></body></html>
