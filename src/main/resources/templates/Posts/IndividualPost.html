<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Conversation · Twibo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <p class="success" th:if="${message}" th:text="${message}"></p>
    <article class="card">
        <a th:href="@{'/users/' + ${article.author.id}}" th:text="${article.author.username}"></a>
        <p class="meta" th:text="${#temporals.format(article.insertTime, 'MMM d, yyyy h:mm a')}"></p>
        <p class="post-content" th:text="${article.content}"></p>
        <form method="post" th:action="@{'/posts/' + ${article.id} + '/reposts'}">
            <label for="repost-comment">Add a note (optional)</label>
            <input id="repost-comment" maxlength="500" name="comment" type="text">
            <p><button type="submit">Share</button></p>
        </form>
    </article>

    <section class="card">
        <h2>Add a comment</h2>
        <form method="post" th:action="@{'/posts/' + ${article.id} + '/comments'}">
            <label for="comment">Comment</label>
            <textarea id="comment" maxlength="5000" name="content" required></textarea>
            <p><button type="submit">Comment</button></p>
        </form>
    </section>

    <h2>Comments</h2>
    <section aria-live="polite" data-comments th:attr="data-article-id=${article.id}">
        <p class="empty">Loading comments…</p>
    </section>
</main>
</body>
</html>
