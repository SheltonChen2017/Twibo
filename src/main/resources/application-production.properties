# Cloud/container production profile. All three database values are required.
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.compression.enabled=true

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DATABASE_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=10
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.cleanup-cron=0 * * * * *

spring.thymeleaf.cache=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

management.endpoint.health.probes.add-additional-paths=true
