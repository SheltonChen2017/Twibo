<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Your feed · Twibo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<main class="container">
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <p class="success" th:if="${message}" th:text="${message}"></p>
    <section class="card">
        <h1 th:text="'Hello, ' + ${currentUser.username}"></h1>
        <form method="post" th:action="@{/publish}">
            <label for="content">What is happening?</label>
            <textarea id="content" maxlength="5000" name="content" required></textarea>
            <p><button type="submit">Publish</button></p>
        </form>
    </section>
    <section aria-live="polite" data-feed>
        <p class="card empty">Loading your feed…</p>
    </section>
</main>
</body>
</html>
