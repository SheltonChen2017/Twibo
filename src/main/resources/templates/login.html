<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · Twibo</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<main id="main-content" class="auth-page">
  <div class="auth-wrap">
    <a class="brand auth-brand" th:href="@{/}"><span class="brand-mark" aria-hidden="true">T</span><span>Twibo</span></a>
    <section class="card auth-card">
      <h1>Welcome back</h1>
      <p>Sign in to catch up with your people.</p>
      <div class="alert error" role="alert" th:if="${error}" th:text="${error}"></div>
      <div class="alert message" role="status" th:if="${message}" th:text="${message}"></div>
      <form class="stack" th:action="@{/login}" method="post">
        <div class="field"><label for="username">Username</label><input id="username" name="username" required maxlength="30" autocomplete="username" autocapitalize="none"></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" name="password" required maxlength="72" autocomplete="current-password"></div>
        <button type="submit">Sign in</button>
      </form>
      <p class="auth-footer"><a th:href="@{/recover}">Forgot password?</a> · <a th:href="@{/signup}">Create account</a></p>
    </section>
  </div>
</main>
</body>
</html>
