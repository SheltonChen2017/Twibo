<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Find people · Twibo</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main-content" class="shell">
  <section class="card composer">
    <h1>Find your people</h1>
    <p class="meta">Search by all or part of a username.</p>
    <div class="alert error" role="alert" th:if="${error}" th:text="${error}"></div>
    <form class="stack" th:action="@{/search}" method="get" role="search">
      <div class="field"><label class="sr-only" for="people-search">Username</label><input id="people-search" name="q" th:value="${q}" required maxlength="50" autocomplete="off" placeholder="Try “maya”"></div>
      <div class="form-actions"><button type="submit">Search</button></div>
    </form>
  </section>
  <a class="card profile-card" th:each="user : ${users}" th:href="@{/users/{id}(id=${user.id})}">
    <span class="avatar" aria-hidden="true" th:text="${#strings.substring(user.username,0,1)}"></span>
    <span th:text="${user.username}"></span>
  </a>
  <section class="card empty" th:if="${!#strings.isEmpty(q) and #lists.isEmpty(users) and error == null}">
    <strong>No matching people.</strong><span>Try a shorter or differently spelled username.</span>
  </section>
</main>
</body>
</html>
