spring.application.name=twibo
server.port=${PORT:8321}

# Zero-setup local database. Use the mysql profile for an existing MySQL installation.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/twibo;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

twibo.feed.page-size=${TWIBO_FEED_PAGE_SIZE:30}
twibo.password-reset.ttl-minutes=${TWIBO_PASSWORD_RESET_TTL_MINUTES:10}
