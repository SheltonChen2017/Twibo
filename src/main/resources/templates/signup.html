<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Create an account · Twibo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<main class="container">
    <section class="card auth-card">
        <h1>Create your account</h1>
        <form method="post" th:action="@{/addUser}" th:object="${registration}">
            <label for="username">Username</label>
            <input autocomplete="username" data-username-check id="username" maxlength="35" minlength="3"
                   required th:field="*{username}" type="text">
            <span data-username-result></span>
            <span class="field-error" th:errors="*{username}"></span>

            <label for="password">Password</label>
            <input autocomplete="new-password" id="password" maxlength="72" minlength="10"
                   required th:field="*{password}" type="password">
            <span class="field-error" th:errors="*{password}"></span>

            <label for="birthday">Date of birth</label>
            <input id="birthday" required th:field="*{birthday}" type="date">
            <span class="field-error" th:errors="*{birthday}"></span>

            <label for="securityQuestion">Recovery question</label>
            <input id="securityQuestion" maxlength="200" required th:field="*{securityQuestion}" type="text">
            <span class="field-error" th:errors="*{securityQuestion}"></span>

            <label for="securityAnswer">Recovery answer</label>
            <input autocomplete="off" id="securityAnswer" maxlength="200" required
                   th:field="*{securityAnswer}" type="password">
            <span class="field-error" th:errors="*{securityAnswer}"></span>

            <label for="captcha">Verification code</label>
            <div class="captcha-row">
                <img alt="Verification code" data-captcha-image th:src="@{/veriCode}">
                <button data-captcha-refresh type="button">New code</button>
            </div>
            <input autocomplete="off" id="captcha" required th:field="*{captcha}" type="text">
            <span class="field-error" th:errors="*{captcha}"></span>

            <p><button type="submit">Create account</button></p>
        </form>
        <p>Already registered? <a th:href="@{/login}">Log in</a>.</p>
    </section>
</main>
</body>
</html>
