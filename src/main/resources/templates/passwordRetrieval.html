<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Recover your account · Twibo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body>
<main class="container">
    <section class="card auth-card">
        <h1>Recover your account</h1>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <form data-recovery-form method="post" th:action="@{/verifyQA}">
            <label for="recovery-username">Username</label>
            <input data-recovery-username id="recovery-username" maxlength="35" name="username" required type="text">
            <label for="recovery-question">Recovery question</label>
            <select data-recovery-questions id="recovery-question" name="question" required></select>
            <p class="error" data-recovery-status></p>
            <label for="recovery-answer">Answer</label>
            <input autocomplete="off" id="recovery-answer" name="answer" required type="password">
            <p><button type="submit">Continue</button></p>
        </form>
        <p><a th:href="@{/login}">Back to login</a></p>
    </section>
</main>
</body>
</html>
