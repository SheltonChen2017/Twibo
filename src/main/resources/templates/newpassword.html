<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Choose a new password · Twibo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <section class="card auth-card">
        <h1>Choose a new password</h1>
        <p th:text="'Resetting the password for ' + ${resetUsername} + '.'"></p>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <form method="post" th:action="@{/changePassword}">
            <label for="password">New password</label>
            <input autocomplete="new-password" id="password" maxlength="72" minlength="10"
                   name="password" required type="password">
            <p><button type="submit">Update password</button></p>
        </form>
    </section>
</main>
</body>
</html>
