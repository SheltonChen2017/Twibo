<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Choose a new password · Twibo</title><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<main id="main-content" class="auth-page">
  <div class="auth-wrap">
    <a class="brand auth-brand" th:href="@{/}"><span class="brand-mark" aria-hidden="true">T</span><span>Twibo</span></a>
    <section class="card auth-card">
      <h1>Choose a new password</h1>
      <p>This recovery window expires in 10 minutes.</p>
      <div class="alert error" role="alert" th:if="${error}" th:text="${error}"></div>
      <form class="stack" th:action="@{/recover/reset}" method="post">
        <div class="field">
          <label for="password">New password</label>
          <input id="password" type="password" name="password" minlength="8" maxlength="72" required autocomplete="new-password" aria-describedby="password-hint">
          <span class="hint" id="password-hint">Use at least 8 characters and avoid passwords you use elsewhere.</span>
        </div>
        <button type="submit">Update password</button>
      </form>
    </section>
  </div>
</main>
</body>
</html>
