<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Twibo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="hero">
    <div class="hero-content">
        <img alt="Twibo" class="hero-logo" th:src="@{/img/majorlogo.png}">
        <p>Share updates, join conversations, and keep up with people you care about.</p>
        <div class="button-row">
            <a class="button" th:href="@{/login}">Log in</a>
            <a class="button secondary" th:href="@{/signup}">Create an account</a>
        </div>
    </div>
</main>
</body>
</html>
