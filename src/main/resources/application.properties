spring.application.name=Twibo
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
server.port=${PORT:8321}

# Works out of the box with a persistent local H2 database.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/twibo;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false
spring.session.jdbc.initialize-schema=always

spring.thymeleaf.cache=false
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Optional, read-only Trading Agent integration.
trading-agent.base-url=${TRADING_AGENT_BASE_URL:}
trading-agent.api-token=${TRADING_AGENT_API_TOKEN:}
trading-agent.connect-timeout=${TRADING_AGENT_CONNECT_TIMEOUT:2s}
trading-agent.read-timeout=${TRADING_AGENT_READ_TIMEOUT:8s}

# For MySQL, set DATABASE_URL, DATABASE_USERNAME, and DATABASE_PASSWORD.
