spring.application.name=Twibo
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
server.port=${PORT:8321}

# Works out of the box with a persistent local H2 database.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/twibo;MODE=MySQL;AUTO_SERVER=TRUE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false

spring.thymeleaf.cache=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=4h
server.tomcat.max-http-form-post-size=32KB
server.tomcat.max-swallow-size=32KB
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# For MySQL, set DATABASE_URL, DATABASE_USERNAME, and DATABASE_PASSWORD.
